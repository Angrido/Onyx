packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@prisma/engines"
  - better-sqlite3
  - esbuild
  - node-pty
  - prisma
  - sharp
  - tree-sitter
  - tree-sitter-javascript
  - tree-sitter-python
  - tree-sitter-typescript
  - unrs-resolver

peerDependencyRules:
  allowedVersions:
    tree-sitter: "0.25"

overrides:
  postcss@<8.5.23: ^8.5.23
  mysql2@<3.23.1: ^3.23.1
